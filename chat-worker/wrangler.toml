name = "goganghee-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# IP당 60초에 10회. 그 이상은 429.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://ghko99.github.io,http://localhost:8000,http://127.0.0.1:8000"
MODELS = "gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "ChatRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRelay"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VEC"
index_name = "portfolio-chunks"
