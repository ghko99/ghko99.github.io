name = "goganghee-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# IP당 60초에 10회. 그 이상은 429.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://ghko99.github.io,http://localhost:8000,http://127.0.0.1:8000"
MODEL = "gemini-3.5-flash-lite"
